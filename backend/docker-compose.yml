services:
  postgres:
    image: postgres:16-alpine
    container_name: iotsense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iotsense
      POSTGRES_USER: iotsense
      POSTGRES_PASSWORD: iotsense
    ports:
      - "5432:5432"
    volumes:
      - iotsense-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iotsense -d iotsense"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  iotsense-postgres-data:
